[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "exercise2-person-validation"
version = "1.0.0"
description = "Exercise 2: Person validation implemented with TDD"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "miojogu" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
]

[tool.setuptools.packages.find]
include = ["exercise2*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["exercise2"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

